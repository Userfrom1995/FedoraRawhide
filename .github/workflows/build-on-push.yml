name: Build (on push)

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-wsl:
    runs-on: ubuntu-latest
    container:
      image: fedora:rawhide
      options: --security-opt seccomp=unconfined
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Build Rawhide WSL rootfs
        run: ./rawhide/build-rawhide.sh

      - name: Upload WSL artifact
        uses: actions/upload-artifact@v4
        with:
          name: fedora-rawhide-wsl
          path: rawhide/Fedora-Rawhide-WSL.wsl
          retention-days: 7
          if-no-files-found: error

  build-vmware:
    runs-on: ubuntu-latest
    container:
      image: fedora:rawhide
      options: --privileged
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Build Rawhide VMware OVA
        run: ./rawhide/build-vmware.sh

      - name: Upload VMware OVA artifact
        uses: actions/upload-artifact@v4
        with:
          name: fedora-rawhide-vmware
          path: rawhide/Fedora-Rawhide-VMware.ova
          retention-days: 7
          if-no-files-found: error
