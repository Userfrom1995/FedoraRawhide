name: Weekly Release

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 6am UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  init:
    runs-on: ubuntu-latest
    outputs:
      date: ${{ steps.timestamp.outputs.date }}
      time: ${{ steps.timestamp.outputs.time }}
    steps:
      - name: Get timestamp
        id: timestamp
        run: |
          echo "date=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT
          echo "time=$(date +%H%M)" >> $GITHUB_OUTPUT

  build-wsl:
    needs: init
    runs-on: ubuntu-latest
    container:
      image: fedora:rawhide
      options: --security-opt seccomp=unconfined
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Build Rawhide WSL rootfs
        run: ./rawhide/build-rawhide.sh

      - name: Upload WSL artifact
        uses: actions/upload-artifact@v4
        with:
          name: fedora-rawhide-wsl
          path: rawhide/Fedora-Rawhide-WSL.wsl
          retention-days: 7
          if-no-files-found: error

  build-vmware:
    needs: init
    runs-on: ubuntu-latest
    container:
      image: fedora:rawhide
      options: --privileged
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Build Rawhide VMware OVA
        run: ./rawhide/build-vmware.sh

      - name: Upload VMware OVA artifact
        uses: actions/upload-artifact@v4
        with:
          name: fedora-rawhide-vmware
          path: rawhide/Fedora-Rawhide-VMware.ova
          retention-days: 7
          if-no-files-found: error

  publish-release:
    needs: [init, build-wsl, build-vmware]
    if: always() && !cancelled() && (needs.build-wsl.result == 'success' || needs.build-vmware.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files and description
        id: prep
        run: |
          mkdir -p release-files
          BODY="Weekly automated build of Fedora Rawhide for WSL and VMware Workstation Pro."

          if [ -f artifacts/fedora-rawhide-wsl/Fedora-Rawhide-WSL.wsl ]; then
            cp artifacts/fedora-rawhide-wsl/Fedora-Rawhide-WSL.wsl release-files/
            BODY="$BODY"$'\n\n- **WSL 2 Package**: `Fedora-Rawhide-WSL.wsl` (included)'
          else
            BODY="$BODY"$'\n\n- **WSL 2 Package**: Failed to build in this cycle'
          fi

          if [ -f artifacts/fedora-rawhide-vmware/Fedora-Rawhide-VMware.ova ]; then
            cp artifacts/fedora-rawhide-vmware/Fedora-Rawhide-VMware.ova release-files/
            BODY="$BODY"$'\n- **VMware OVA Appliance**: `Fedora-Rawhide-VMware.ova` (included)'
          else
            BODY="$BODY"$'\n- **VMware OVA Appliance**: Failed to build in this cycle'
          fi

          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rawhide-${{ needs.init.outputs.date }}-${{ needs.init.outputs.time }}
          name: 'Fedora Rawhide ${{ needs.init.outputs.date }} ${{ needs.init.outputs.time }} UTC'
          body: ${{ steps.prep.outputs.body }}
          files: release-files/*
          draft: false
          prerelease: false

      - name: Cleanup old releases
        uses: actions/github-script@v7
        with:
          script: |
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            const rawhideReleases = releases.data
              .filter(r => r.tag_name.startsWith('rawhide-'));
            const cutoff = new Date();
            cutoff.setMonth(cutoff.getMonth() - 1);
            let deleted = 0;
            for (const release of rawhideReleases) {
              const match = release.tag_name.match(/^rawhide-(\d{4})-(\d{2})-(\d{2})/);
              if (!match) continue;
              const [, y, m, d] = match;
              const releaseDate = new Date(Date.UTC(Number(y), Number(m) - 1, Number(d)));
              if (releaseDate < cutoff) {
                await github.rest.repos.deleteRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: release.id
                });
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `tags/${release.tag_name}`
                });
                deleted++;
              }
            }
            console.log(`Cleaned up ${deleted} releases older than 1 month`);

      - name: Check overall build results
        if: needs.build-wsl.result != 'success' || needs.build-vmware.result != 'success'
        run: |
          echo "WARNING: One of the builds did not complete successfully (WSL: ${{ needs.build-wsl.result }}, VMware: ${{ needs.build-vmware.result }})."
          exit 1
